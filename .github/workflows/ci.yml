name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  msrv:
    name: MSRV
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in Cargo.toml. Without this job the
      # declared MSRV is an unverified claim.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  clippy:
    name: Clippy
    # Both platforms: the kqueue and PR_SET_PDEATHSIG paths are cfg-gated, so a
    # single-OS run cannot see lints (or dead code) in the other one.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` lints tests too. Without it, test code drifts out of
      # lint compliance unnoticed until someone runs clippy locally.
      - run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Run the tool directly rather than through rustsec/audit-check: that
      # action creates a GitHub check-run, which needs `checks: write` on the
      # token and fails with "Resource not accessible by integration" without it.
      # The findings are just as visible in the job log, with no extra permission.
      #
      # This tool kills processes on the user's machine, so a known-vulnerable
      # dependency reaching a release is worth failing the build over. Plain
      # `cargo audit` fails on vulnerabilities only; `unmaintained`/`unsound`
      # warnings are reported without failing, which is the right default here —
      # `daemonize` is unmaintained and there is no drop-in replacement yet.
      - run: cargo audit
