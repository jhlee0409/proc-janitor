[package]
name = "proc-janitor"
version = "0.10.0"
edition = "2021"
# Verified in CI (the `msrv` job) against the committed Cargo.lock.
#
# This was 1.82, held there by pinning `time` back to 0.3.41. `cargo audit` then
# showed that pin was holding a crate with a published advisory
# (RUSTSEC-2026-0009, DoS via stack exhaustion, fixed in 0.3.47) — a bad trade for
# a lower floor, since most users install a prebuilt binary or via Homebrew where
# the MSRV never applies. `time` is current again and this follows it honestly.
rust-version = "1.88"
authors = ["Jack <jhlee0409@users.noreply.github.com>"]
description = "Automatic orphan process cleaner daemon for macOS/Linux"
license = "MIT"
repository = "https://github.com/jhlee0409/proc-janitor"
homepage = "https://github.com/jhlee0409/proc-janitor"
readme = "README.md"
keywords = ["process", "daemon", "cleanup", "orphan", "macos"]
categories = ["command-line-utilities", "os"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Terminal UI
owo-colors = "4"
supports-color = "3"
indicatif = "0.17"

# Process management
sysinfo = "0.31"
# `event` = kqueue, used by `exec` to watch the parent process for exit.
nix = { version = "0.29", features = ["signal", "process", "event"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
anyhow = "1"
dirs = "5"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
fs2 = "0.4"

# Daemon
daemonize = "0.5"

# Signal handling
# SIGINT/SIGTERM => shutdown, SIGHUP => config reload (routed in daemon.rs).
# Note: ctrlc's "termination" feature would route SIGHUP to the shutdown
# handler, which made `proc-janitor reload` kill the daemon. signal-hook lets
# us dispatch each signal to a distinct action.
signal-hook = "0.3"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
filetime = "0.2"
serial_test = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
