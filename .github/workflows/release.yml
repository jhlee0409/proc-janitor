name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="proc-janitor-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/proc-janitor" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cd dist
          tar czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            awk "/^## \\[?${tag#v}\\]?/{found=1; next} /^## /{found=0} found{print}" CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Release ${tag}" > notes.md
          fi
          # Append install instructions
          cat >> notes.md << 'EOF'

          ---

          ## Install

          **macOS (Apple Silicon)**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/jhlee0409/proc-janitor/main/scripts/install-binary.sh | sh
          ```

          **Homebrew**
          ```bash
          brew install jhlee0409/tap/proc-janitor
          ```

          **Cargo**
          ```bash
          cargo install proc-janitor
          ```

          **Manual download:** Pick the archive for your platform below, extract, and place `proc-janitor` in your PATH.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          generate_release_notes: false

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Calculate checksums and update formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"

          # Extract SHA256 from .sha256 files
          sha_aarch64_darwin=$(awk '{print $1}' dist/proc-janitor-${tag}-aarch64-apple-darwin.tar.gz.sha256)
          sha_x86_64_darwin=$(awk '{print $1}' dist/proc-janitor-${tag}-x86_64-apple-darwin.tar.gz.sha256)
          sha_aarch64_linux=$(awk '{print $1}' dist/proc-janitor-${tag}-aarch64-unknown-linux-gnu.tar.gz.sha256)
          sha_x86_64_linux=$(awk '{print $1}' dist/proc-janitor-${tag}-x86_64-unknown-linux-gnu.tar.gz.sha256)

          # Clone homebrew-tap
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jhlee0409/homebrew-tap.git" tap
          cd tap

          # Generate updated formula
          cat > Formula/proc-janitor.rb << EOF
          class ProcJanitor < Formula
            desc "Automatic orphan process cleanup daemon for macOS"
            homepage "https://github.com/jhlee0409/proc-janitor"
            license "MIT"
            version "${version}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/jhlee0409/proc-janitor/releases/download/v#{version}/proc-janitor-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${sha_aarch64_darwin}"
              else
                url "https://github.com/jhlee0409/proc-janitor/releases/download/v#{version}/proc-janitor-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${sha_x86_64_darwin}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/jhlee0409/proc-janitor/releases/download/v#{version}/proc-janitor-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_aarch64_linux}"
              else
                url "https://github.com/jhlee0409/proc-janitor/releases/download/v#{version}/proc-janitor-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_x86_64_linux}"
              end
            end

            def install
              bin.install "proc-janitor"
            end

            service do
              run [opt_bin/"proc-janitor", "start", "--foreground"]
              keep_alive true
              log_path var/"log/proc-janitor.log"
              error_log_path var/"log/proc-janitor-error.log"
            end

            test do
              assert_match "proc-janitor", shell_output("#{bin}/proc-janitor version")
            end
          end
          EOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/proc-janitor.rb

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/proc-janitor.rb
          git commit -m "Update proc-janitor to ${version}"
          git push
