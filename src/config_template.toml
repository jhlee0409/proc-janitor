# proc-janitor configuration
# Location: ~/.config/proc-janitor/config.toml
# Documentation: https://github.com/jhlee0409/proc-janitor
#
# Environment variables (PROC_JANITOR_*) override these settings.

# ─── Scan Settings ───────────────────────────────────────────────────────────

# How often the daemon scans for orphaned processes (seconds, 1-3600)
#
# This bounds *discovery* only: how long until a newly started process is known
# to the daemon. Reacting to a known process being orphaned is event-driven
# (kqueue NOTE_EXIT on its parent) and takes milliseconds regardless of this
# value, so raising it trades discovery latency for CPU, not responsiveness.
scan_interval = 5

# Time to wait before killing a newly detected orphan (seconds, 0-3600)
# Prevents false positives from processes that are briefly re-parented.
grace_period = 30

# Time to wait after SIGTERM before sending SIGKILL (seconds, 1-60)
sigterm_timeout = 5

# ─── Target Patterns ────────────────────────────────────────────────────────
# Regex patterns matched against process command lines.
# Only orphaned processes (PPID=1) matching these patterns will be cleaned.
#
# Examples:
#   "node"             - any process with "node" in its command line
#   "node.*claude"     - Node.js processes related to Claude Code
#   "^/usr/bin/python"  - Python processes started from /usr/bin
#   "webpack|vite"     - webpack or vite dev servers

{targets}

# ─── Whitelist Patterns ─────────────────────────────────────────────────────
# Regex patterns for processes that should NEVER be killed, even if they
# match a target pattern. Whitelist takes priority over targets.
#
# Examples:
#   "node.*server"    - protect your web servers
#   "pm2"             - protect process managers
#   "node.*next"      - protect Next.js dev server

{whitelist}

# ─── Orphan Evidence ────────────────────────────────────────────────────────
# By default a process is a candidate as soon as its PPID is 1. On macOS that
# is a weak signal: launchd both reparents orphans and directly launches most
# agents, so the majority of your own processes already have PPID 1 and safety
# rests entirely on the target patterns above.
#
# With this enabled, a candidate must also show that the session it belonged to
# is gone — its session leader (the terminal or shell that started it) no longer
# exists. That excludes launchd/systemd-managed services and processes whose
# session is still alive, at the cost of missing orphans that called setsid()
# (they become their own session leader, which is indistinguishable from a
# deliberately detached daemon).
#
# Run `proc-janitor scan` to see the evidence for each detected process.
require_dead_session = false

# ─── Logging ─────────────────────────────────────────────────────────────────

[logging]
# Enable or disable file logging
enabled = true

# Log directory (absolute path required, ~ is not expanded)
# Logs are rotated daily and old files are cleaned automatically.
path = "{log_path}"

# Number of days to keep log files (0-365)
retention_days = 7
