name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="proc-janitor-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/proc-janitor" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cd dist
          tar czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            awk "/^## \\[?${tag#v}\\]?/{found=1; next} /^## /{found=0} found{print}" CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Release ${tag}" > notes.md
          fi
          # Append install instructions
          cat >> notes.md << 'EOF'

          ---

          ## Install

          **macOS (Apple Silicon)**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/jhlee0409/proc-janitor/main/scripts/install-binary.sh | sh
          ```

          **Homebrew**
          ```bash
          brew install jhlee0409/tap/proc-janitor
          ```

          **Cargo**
          ```bash
          cargo install proc-janitor
          ```

          **Manual download:** Pick the archive for your platform below, extract, and place `proc-janitor` in your PATH.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          generate_release_notes: false

  # The Homebrew formula is no longer pushed from here.
  #
  # This job used to clone jhlee0409/homebrew-tap and commit the updated formula,
  # which needs a cross-repo token (HOMEBREW_TAP_TOKEN). That token expired and
  # the job failed on every release from v0.8.3 through v0.10.1 — five in a row —
  # with "Invalid username or token". Because the build and release jobs stayed
  # green, the failure was easy to miss, and the formula was updated by hand each
  # time.
  #
  # The tap now pulls instead: .github/workflows/update-formula.yml there reads
  # this repo's latest release and commits with its own GITHUB_TOKEN, so there is
  # no secret to expire and a missed run is picked up by the next scheduled one.
  # It runs daily; to publish immediately after a release:
  #
  #   gh workflow run update-formula.yml -R jhlee0409/homebrew-tap
  homebrew-reminder:
    name: Homebrew
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: How the formula gets updated
        run: |
          {
            echo "### Homebrew"
            echo
            echo "The tap updates itself (daily schedule). To publish now:"
            echo
            echo '```'
            echo "gh workflow run update-formula.yml -R jhlee0409/homebrew-tap"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
